<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Tree</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/canvas.css">
  <link rel="stylesheet" href="styles/tree.css">
  <link rel="stylesheet" href="styles/details.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <aside class="sidebar">
    <header class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="8" r="5" />
        <circle cx="9" cy="31" r="5" />
        <circle cx="31" cy="31" r="5" />
        <path d="M20 13v8M9 26v-5h22v5" />
      </svg>
      <div>
        <h1>Family Tree</h1>
        <p>Build and explore your family history</p>
      </div>
    </header>

    <section class="panel" id="person-panel">
      <h2 id="form-title">Add person</h2>
      <form id="person-form" autocomplete="off">
        <label><span>First name(s) <span class="req">*</span></span>
          <input name="firstNames" required placeholder="e.g. Jan Paweł">
        </label>
        <div class="row">
          <label><span>Surname <span class="req">*</span></span>
            <input name="surname" required placeholder="e.g. Kowalski">
          </label>
          <label>Family name
            <input name="familyName" placeholder="birth / maiden">
          </label>
        </div>
        <div class="row">
          <label>Birth date
            <input type="date" name="birth">
          </label>
          <label>Death date
            <input type="date" name="death">
          </label>
        </div>
        <label>Gender
          <select name="gender">
            <option value="">Unspecified</option>
            <option value="f">Female</option>
            <option value="m">Male</option>
          </select>
        </label>

        <fieldset id="connect-fieldset">
          <legend>Connect to existing person</legend>
          <div class="row">
            <select name="relation" aria-label="Relation">
              <option value="">No connection</option>
              <option value="childOf">Child of</option>
              <option value="parentOf">Parent of</option>
              <option value="partnerOf">Partner of</option>
            </select>
            <select name="relative" aria-label="Relative" disabled></select>
          </div>
          <div id="also-parents"></div>
          <div class="line-type" role="radiogroup" aria-label="Line type">
            <label class="chip">
              <input type="radio" name="blood" value="1" checked>
              <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" class="ls blood" /></svg>Blood</span>
            </label>
            <label class="chip">
              <input type="radio" name="blood" value="0">
              <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" class="ls nonblood" /></svg>Not blood</span>
            </label>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Add to tree</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel" id="link-panel">
      <h2>Connect people</h2>
      <form id="link-form">
        <select name="a" aria-label="First person"></select>
        <select name="type" aria-label="Relation">
          <option value="parent">is parent of</option>
          <option value="child">is child of</option>
          <option value="partner">is partner of</option>
        </select>
        <select name="b" aria-label="Second person"></select>
        <div class="line-type" role="radiogroup" aria-label="Line type">
          <label class="chip">
            <input type="radio" name="blood" value="1" checked>
            <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" class="ls blood" /></svg>Blood</span>
          </label>
          <label class="chip">
            <input type="radio" name="blood" value="0">
            <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" class="ls nonblood" /></svg>Not blood</span>
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="primary">Connect</button>
        </div>
      </form>
      <p class="hint" id="link-hint">Add at least two people to connect them.</p>
    </section>

    <section class="panel tools">
      <button type="button" id="export-btn">Export JSON</button>
      <button type="button" id="import-btn">Import JSON</button>
      <button type="button" id="demo-btn">Load demo</button>
      <button type="button" id="clear-btn" class="danger">Clear all</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </section>
  </aside>

  <main class="canvas">
    <svg id="tree" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
          <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1d2433" flood-opacity="0.10" />
        </filter>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>

    <div class="stats" id="stats"></div>

    <div class="empty" id="empty" hidden>
      <h3>Your tree is empty</h3>
      <p>Add the first person using the form on the left, or load the demo family.</p>
    </div>

    <div class="legend">
      <div><svg width="40" height="8"><line x1="2" y1="4" x2="38" y2="4" class="ls blood" /></svg>Blood relation</div>
      <div><svg width="40" height="8"><line x1="2" y1="4" x2="38" y2="4" class="ls nonblood" /></svg>Not blood (partner, adoption, step)</div>
    </div>

    <div class="zoom">
      <button type="button" id="zoom-in" title="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out">&minus;</button>
      <button type="button" id="zoom-fit" title="Fit tree to screen">&#x2922;</button>
    </div>

    <div class="details" id="details" hidden></div>
    <div class="toast" id="toast" role="status"></div>
  </main>

</body>
</html>
